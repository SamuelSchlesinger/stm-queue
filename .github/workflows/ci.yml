name: Haskell CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        ghc-version: ['9.6.7', '9.8.4', '9.10.3', '9.12.4', '9.14.1']

    name: GHC ${{ matrix.ghc-version }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Haskell
      id: setup-haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc-version }}
        cabal-version: '3.16.1.0'
        cabal-update: false

    - name: Cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.setup-haskell.outputs.cabal-store }}
          ~/.cabal/packages
        key: ${{ runner.os }}-${{ runner.arch }}-ghc-${{ matrix.ghc-version }}-${{ hashFiles('**/*.cabal') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-ghc-${{ matrix.ghc-version }}-

    - name: Install dependencies
      run: |
        cabal update
        cabal build --only-dependencies --enable-tests --enable-benchmarks
    - name: Build
      run: cabal build --enable-tests --enable-benchmarks --ghc-options=-Werror all
    - name: Run tests
      run: cabal test all --test-options='+RTS -N2 -RTS'
    - name: Package checks
      if: matrix.ghc-version == '9.14.1'
      run: |
        cabal check
        cabal haddock all --haddock-for-hackage
        cabal sdist all
